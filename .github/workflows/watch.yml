name: Watch the reference tables

# Once a day: compare our world records with the published tables, and start from any better
# published solution, credited to its source.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/watch-references.mjs
      - id: save
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "kickswarm-records[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.jsonl records problems
          git commit -m "Watch: reference tables updated"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  site:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
