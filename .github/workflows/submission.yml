name: Judge submissions

# Each run handles every open "[solution]" issue not yet judged, oldest first. GitHub keeps only one
# queued run per concurrency group and cancels the others during a burst; the sweep (and the schedule
# below) makes sure no submission is ever lost. The judge code always comes from the main branch; a
# submission is only data.
on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  judge:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[solution]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.robot.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: robot
        run: node scripts/robot.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save the registry
        if: steps.robot.outputs.changed == 'true' || hashFiles('relay-rejected.json') != ''
        run: |
          git config user.name "kickswarm-records[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.jsonl records solutions trophies relay-rejected.json
          git diff --cached --quiet && exit 0
          git commit -m "Registry: ${{ steps.robot.outputs.count }} submission(s)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Reply and close
        if: steps.robot.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reply.mjs

  site:
    needs: judge
    if: needs.judge.outputs.changed == 'true'
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
